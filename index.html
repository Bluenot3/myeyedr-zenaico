    <script>
      // Light-first paint: default to the light optical gradient unless the
      // user has explicitly chosen dark. Prevents a dark flash before mount.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "dark") {
            document.documentElement.classList.add("light");
            document.documentElement.style.colorScheme = "light";
          }
        } catch (e) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
